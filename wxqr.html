<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>微信扫码登录腾讯云</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  color: #fff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
.container {
  text-align: center;
  padding: 30px 20px;
  width: 100%;
  max-width: 420px;
}
h2 { margin-bottom: 8px; font-weight: 500; font-size: 20px; }
.sub { color: #888; font-size: 13px; margin-bottom: 25px; }
#wx_qr_wrap {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 320px;
}
#wx_qr_wrap iframe {
  border: none;
  width: 300px;
  height: 380px;
}
.loading {
  color: #666;
  font-size: 14px;
}
.hint {
  margin-top: 25px;
  font-size: 12px;
  color: #666;
  line-height: 1.8;
}
.fallback {
  margin-top: 15px;
}
.fallback a {
  color: #4ea1f5;
  font-size: 13px;
  text-decoration: none;
}
.error-box {
  background: rgba(255,107,107,0.1);
  border: 1px solid rgba(255,107,107,0.3);
  border-radius: 8px;
  padding: 20px;
  margin-top: 15px;
  color: #ff6b6b;
  font-size: 13px;
}
</style>
</head>
<body>
<div class="container">
  <h2>🔐 微信扫码登录</h2>
  <p class="sub">用于添加安全组规则 · 放行端口 3445</p>
  <div id="wx_qr_wrap">
    <div class="loading">⏳ 加载二维码中...</div>
  </div>
  <div class="hint">
    请使用微信扫一扫扫描上方二维码<br>
    或在微信中长按识别
  </div>
  <div class="fallback">
    <a href="https://cloud.tencent.com/login?s_url=https%3A%2F%2Fconsole.cloud.tencent.com%2Fcvm%2Fsecuritygroup" target="_blank">👉 打不开？点此跳转腾讯云登录页</a>
  </div>
  <div id="error_msg" class="error-box" style="display:none"></div>
</div>

<script src="https://res.wx.qq.com/connect/zh_CN/htmledition/js/wxlogin.js"></script>
<script>
function initWxLogin() {
  var obj = new WxLogin({
    self_redirect: true,
    id: 'wx_qr_wrap',
    appid: 'wxca396cd1df083b9d',
    scope: 'snsapi_login',
    redirect_uri: encodeURIComponent('https://cloud.tencent.com/login/callback?intent_id=19f4d057317_ef053ccb6142&login_type=wx&s_url=https%3A%2F%2Fconsole.cloud.tencent.com%2Fcvm%2Fsecuritygroup&fwd_flag=7&action=associate'),
    state: 'hermes_3445_' + Date.now(),
    style: 'black',
    href: ''
  });
}

// Retry with small delay to ensure script loaded
setTimeout(initWxLogin, 500);
</script>
</body>
</html>
